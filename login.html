<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 管理登入</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 320px; text-align: center; }
        h2 { margin-bottom: 10px; color: #1d1d1f; }
        p { font-size: 14px; color: #86868b; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d2d2d7; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #ccc; }
        #msg { margin-top: 15px; font-size: 13px; min-height: 20px; }
        .success { color: #34c759; }
        .error { color: #ff3b30; }
        .nav-link { margin-top: 20px; display: block; color: #007aff; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>管理員登入</h2>
        <p>請輸入您的憑據以存取地圖</p>
        
        <input type="email" id="email" placeholder="電子郵件" autocomplete="email">
        <input type="password" id="password" placeholder="密碼" autocomplete="current-password">
        <button id="loginBtn">登入系統</button>
        
        <div id="msg"></div>
        
        <a id="adminLink" href="admin.html" class="nav-link" style="display:none;">✅ 驗證成功，點此進入監控中心 →</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ⚠️ 務必填入你的 Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginBtn = document.getElementById('loginBtn');
        const msgDiv = document.getElementById('msg');
        const adminLink = document.getElementById('adminLink');

        // 核心修正：移除「自動跳轉」，僅顯示登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                msgDiv.innerHTML = `<span class="success">目前已登入：${user.email}</span>`;
                adminLink.style.display = "block"; // 顯示手動跳轉連結
                console.log("登入狀態：已登入");
            } else {
                adminLink.style.display = "none";
                console.log("登入狀態：未登入");
            }
        });

        // 登入邏輯
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                msgDiv.innerHTML = '<span class="error">請輸入完整帳號密碼</span>';
                return;
            }

            loginBtn.disabled = true;
            msgDiv.innerHTML = '正在驗證...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                msgDiv.innerHTML = '<span class="success">登入成功！</span>';
                // 成功後一樣不自動跳轉，讓使用者手動點擊上方連結
            } catch (error) {
                console.error(error);
                msgDiv.innerHTML = `<span class="error">錯誤：${error.message}</span>`;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
