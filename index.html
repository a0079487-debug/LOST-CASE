<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找 Ginnabong - 回報位置</title>
    <style>
        :root { --main-color: #ff6b6b; --bg-color: #f7f1e3; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 400px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; border: 1px solid #eee; }
        .header { background: var(--main-color); color: white; padding: 18px; font-size: 22px; font-weight: bold; }
        .content { padding: 20px; }
        img { width: 100%; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #666; font-weight: 600; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--main-color); }
        button { width: 100%; background: var(--main-color); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #e65b5b; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #e65b5b; }
        button:disabled { background: #d1d1d1; box-shadow: none; cursor: not-allowed; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid white; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">急尋 桔拿棒 (Ginnabong)</div>
        <div class="content">
            <img src="IMG_4353.jpeg" alt="Ginnabong">
            <div class="input-group">
                <label>📍 貓咪目前狀況</label>
                <select id="status">
                    <option value="靜止中（在休息/睡覺）">靜止中（在休息/睡覺）</option>
                    <option value="移動中（正在走路/跑動）">移動中（正在走路/跑動）</option>
                    <option value="已躲起來（草叢/車底）">已躲起來（草叢/車底）</option>
                    <option value="需要協助（受傷或困住）">需要協助（受傷或困住）</option>
                </select>
            </div>
            <div class="input-group">
                <label>📞 您的聯絡電話 (方便主人聯繫)</label>
                <input type="tel" id="phone" placeholder="例如：0912345678">
            </div>
            <button id="btn">回報目前即時位置</button>
            <div id="msg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, GeoPoint, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 注意：請將下方的 Config 內容換成你專屬的金鑰 ---
        const firebaseConfig = {
            apiKey: "你的API_KEY",
            authDomain: "你的PROJECT_ID.firebaseapp.com",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的PROJECT_ID.appspot.com",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn').addEventListener('click', () => {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> 正在連線衛星...';
            msg.innerText = "";

            const options = {
                enableHighAccuracy: false, // 改為 false 以求在電腦/室內能快速回傳
                timeout: 8000,             // 8 秒逾時
                maximumAge: 0              // 強制抓取當前位置
            };

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const catRef = doc(db, "cats", "1");
                    await updateDoc(catRef, {
                        last_location: new GeoPoint(pos.coords.latitude, pos.coords.longitude),
                        status: document.getElementById('status').value,
                        reporter_phone: document.getElementById('phone').value || "未提供",
                        last_seen: serverTimestamp()
                    });
                    msg.style.color = "#00b894";
                    msg.innerText = "✅ 回報成功！辛苦了！";
                    btn.innerText = "發送完成";
                } catch (e) {
                    console.error(e);
                    msg.style.color = "#d63031";
                    msg.innerText = "❌ 傳輸失敗，請檢查網路。";
                    btn.disabled = false;
                    btn.innerText = "重新回報位置";
                }
            }, (err) => {
                btn.disabled = false;
                btn.innerText = "重新回報位置";
                msg.style.color = "#d63031";
                if (err.code === 1) msg.innerText = "❌ 請允許瀏覽器定位權限。";
                else if (err.code === 3) msg.innerText = "❌ 搜尋逾時，請至收訊佳處重試。";
                else msg.innerText = "❌ 無法取得定位資料。";
            }, options);
        });
    </script>
</body>
</html>
