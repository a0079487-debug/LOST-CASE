<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找 Ginnabong - 實時回報系統</title>
    <style>
        :root { --main-color: #ff6b6b; --bg-color: #f7f1e3; }
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 450px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--main-color); color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .content { padding: 20px; }
        img { width: 100%; border-radius: 10px; margin-bottom: 15px; border: 3px solid #eee; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        select, input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none; box-sizing: border-box; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--main-color); }
        button { width: 100%; background: var(--main-color); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #ee5253; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #msg { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; font-weight: bold; }
        .success { display: block !important; background: #dff9fb; color: #0984e3; border: 1px solid #74b9ff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">急尋 桔拿棒 (Ginnabong)</div>
        <div class="content">
            <img src="IMG_4353.jpeg" alt="Ginnabong">
            
            <div class="input-group">
                <label>📍 貓咪目前狀況</label>
                <select id="status">
                    <option value="靜止中（在休息/睡覺）">靜止中（在休息/睡覺）</option>
                    <option value="移動中（正在走路/跑動）">移動中（正在走路/跑動）</option>
                    <option value="已躲起來（草叢/車底）">已躲起來（草叢/車底）</option>
                    <option value="看起來受傷或需要協助">看起來受傷或需要協助</option>
                </select>
            </div>

            <div class="input-group">
                <label>📞 您的聯絡電話 (方便主人聯繫)</label>
                <input type="text" id="phone" placeholder="例如：0912-345-678">
            </div>

            <button id="btn">回報目前即時位置</button>
            <div id="msg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, GeoPoint, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "你的API_KEY",
            authDomain: "你的PROJECT_ID.firebaseapp.com",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的PROJECT_ID.appspot.com",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn').addEventListener('click', async () => {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            
            btn.disabled = true;
            btn.innerText = "正在獲取位置...";

            if (!navigator.geolocation) {
                alert("您的瀏覽器不支持定位功能");
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    await updateDoc(doc(db, "cats", "1"), {
                        last_location: new GeoPoint(pos.coords.latitude, pos.coords.longitude),
                        status: document.getElementById('status').value,
                        reporter_phone: document.getElementById('phone').value || "未提供",
                        last_seen: serverTimestamp()
                    });
                    msg.className = "success";
                    msg.innerText = "✅ 位置已發送！感謝您的協助！";
                    btn.innerText = "發送完成";
                } catch (e) {
                    console.error(e);
                    alert("更新失敗，請檢查網路連線");
                    btn.disabled = false;
                }
            }, (err) => {
                alert("無法獲取定位權限，請開啟 GPS 並允許瀏覽器存取位置");
                btn.disabled = false;
            }, { enableHighAccuracy: true });
        });
    </script>
</body>
</html>
