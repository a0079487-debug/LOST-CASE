<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找 Ginnabong - 實時回報系統</title>
    <style>
        :root { --main-color: #ff6b6b; --bg-color: #f7f1e3; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 450px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .header { background: var(--main-color); color: white; padding: 20px; font-size: 24px; font-weight: bold; }
        .content { padding: 20px; }
        img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        select:focus, input:focus { border-color: var(--main-color); }
        button { width: 100%; background: var(--main-color); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--main-color); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #msg { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">急尋 桔拿棒 (Ginnabong)</div>
        <div class="content">
            <img src="IMG_4353.jpeg" alt="Ginnabong">
            <div class="input-group">
                <label>📍 貓咪目前狀況</label>
                <select id="status">
                    <option value="靜止中（在休息/睡覺）">靜止中（在休息/睡覺）</option>
                    <option value="移動中（正在走路/跑動）">移動中（正在走路/跑動）</option>
                    <option value="已躲起來（草叢/車底）">已躲起來（草叢/車底）</option>
                    <option value="看起來受傷或需要協助">看起來受傷或需要協助</option>
                </select>
            </div>
            <div class="input-group">
                <label>📞 您的聯絡電話 (方便主人聯繫)</label>
                <input type="text" id="phone" placeholder="例如：0912-345-678">
            </div>
            <button id="btn">回報目前即時位置</button>
            <div id="msg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, GeoPoint, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "你的API_KEY",
            authDomain: "你的PROJECT_ID.firebaseapp.com",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的PROJECT_ID.appspot.com",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn').addEventListener('click', () => {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> 正在連線衛星...';

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    await updateDoc(doc(db, "cats", "1"), {
                        last_location: new GeoPoint(pos.coords.latitude, pos.coords.longitude),
                        status: document.getElementById('status').value,
                        reporter_phone: document.getElementById('phone').value || "未提供",
                        last_seen: serverTimestamp()
                    });
                    msg.style.color = "#0984e3";
                    msg.innerText = "✅ 回報成功！感謝您的幫忙！";
                    btn.innerText = "發送完成";
                } catch (e) {
                    msg.style.color = "red";
                    msg.innerText = "❌ 傳輸失敗，請檢查網路";
                    btn.disabled = false;
                    btn.innerText = "重新回報位置";
                }
            }, (err) => {
                msg.style.color = "red";
                msg.innerText = "❌ 無法取得定位，請確認 GPS 已開啟";
                btn.disabled = false;
                btn.innerText = "重新回報位置";
            }, { enableHighAccuracy: false, timeout: 10000 });
        });
    </script>
</body>
</html>
