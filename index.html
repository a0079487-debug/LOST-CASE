<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找 Ginnabong - 實時回報系統</title>
    <style>
        :root { --main-color: #ff6b6b; --bg-color: #f7f1e3; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; max-width: 400px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .header { background: var(--main-color); color: white; padding: 20px; font-size: 24px; font-weight: bold; }
        .content { padding: 20px; }
        img { width: 100%; border-radius: 15px; margin-bottom: 15px; border: 3px solid #eee; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--main-color); }
        button { width: 100%; background: var(--main-color); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #msg { margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--main-color); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">急尋 桔拿棒 (Ginnabong)</div>
        <div class="content">
            <img src="IMG_4353.jpeg" alt="Ginnabong">
            <div class="input-group">
                <label>📍 貓咪目前狀況</label>
                <select id="status">
                    <option value="靜止中">靜止中（在休息/睡覺）</option>
                    <option value="移動中">移動中（正在走路/跑動）</option>
                    <option value="已躲起來">已躲起來（草叢/車底）</option>
                    <option value="受傷或需協助">看起來受傷或需要協助</option>
                </select>
            </div>
            <div class="input-group">
                <label>📞 您的聯絡電話 (選填)</label>
                <input type="tel" id="phone" placeholder="例如：0912345678">
            </div>
            <button id="btn">回報目前即時位置</button>
            <div id="msg"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, GeoPoint, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ 這裡要貼上你從 Firebase Console 複製的金鑰 ⚠️
        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn').addEventListener('click', () => {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> 正在連線衛星...';
            msg.innerText = "";

            // 定位參數：降低精度以求在室內/電腦快速抓取
            const geoOptions = {
                enableHighAccuracy: false, 
                timeout: 10000,             
                maximumAge: 0              
            };

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    // 更新 Firestore 資料庫
                    const catRef = doc(db, "cats", "1");
                    await updateDoc(catRef, {
                        last_location: new GeoPoint(pos.coords.latitude, pos.coords.longitude),
                        status: document.getElementById('status').value,
                        reporter_phone: document.getElementById('phone').value || "未提供",
                        last_seen: serverTimestamp()
                    });
                    
                    msg.style.color = "#2ecc71";
                    msg.innerText = "✅ 回報成功！感謝您的協助。";
                    btn.innerText = "發送完成";
                } catch (e) {
                    console.error("Firebase Error:", e);
                    msg.style.color = "#e74c3c";
                    msg.innerText = "❌ 資料庫更新失敗，請確認 Firebase 設定。";
                    btn.disabled = false;
                    btn.innerText = "重新回報位置";
                }
            }, (err) => {
                btn.disabled = false;
                btn.innerText = "重新回報位置";
                msg.style.color = "#e74c3c";
                if (err.code === 1) msg.innerText = "❌ 請允許定位權限。";
                else if (err.code === 3) msg.innerText = "❌ 定位逾時，請確認 Wi-Fi 是否開啟。";
                else msg.innerText = "❌ 無法取得定位訊號。";
            }, geoOptions);
        });
    </script>
</body>
</html>
