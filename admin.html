<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 監控中心 - 實時地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        .custom-popup { font-family: "Microsoft JhengHei", sans-serif; min-width: 200px; }
        .custom-popup b { color: #ff6b6b; font-size: 16px; }
        .status-tag { display: inline-block; background: #f1f2f6; padding: 2px 8px; border-radius: 5px; margin-top: 5px; color: #2f3542; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "你的API_KEY",
            authDomain: "你的PROJECT_ID.firebaseapp.com",
            projectId: "你的PROJECT_ID",
            storageBucket: "你的PROJECT_ID.appspot.com",
            messagingSenderId: "你的SENDER_ID",
            appId: "你的APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 初始化地圖中心 (先設在中原大學附近)
        const map = L.map('map').setView([24.958, 121.24], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 建立一個圖釘
        const marker = L.marker([24.958, 121.24]).addTo(map);

        // 即時聽取資料庫變化
        onSnapshot(doc(db, "cats", "1"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const { latitude, longitude } = data.last_location;
                
                // 處理時間顯示
                const timeString = data.last_seen 
                    ? data.last_seen.toDate().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) 
                    : "正在讀取時間...";

                const pos = [latitude, longitude];
                marker.setLatLng(pos);
                map.panTo(pos); // 地圖自動跟隨

                // 更新資訊視窗
                marker.bindPopup(`
                    <div class="custom-popup">
                        <b>📍 發現 Ginnabong！</b><br>
                        <div class="status-tag">狀態：${data.status || '未知'}</div><br>
                        📞 聯絡路人：<a href="tel:${data.reporter_phone}">${data.reporter_phone || '未提供'}</a><br>
                        🕒 最後看到：<br>${timeString}
                    </div>
                `).openPopup();
            }
        });
    </script>
</body>
</html>
