<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 穩定監控中心</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #007aff; --bg: #f5f5f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; background: white; border-right: 1px solid #d2d2d7; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #eee; }
        #pet-list { flex: 1; overflow-y: auto; padding: 15px; }
        .pet-item { padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #e5e5e7; cursor: pointer; background: #fff; }
        .pet-item:hover { border-color: var(--accent); }
        #map { flex: 1; height: 100%; width: 100%; background: #e0e0e0; }
        /* 權限警告標籤 */
        #auth-alert { padding: 12px; background: #fff3cd; color: #856404; font-size: 13px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="auth-alert">🔒 尚未登入，請先完成驗證</div>
        <div class="sidebar-header">
            <h1 style="font-size: 20px; margin:0;">監控中心</h1>
            <a href="login.html" style="font-size: 12px; color: var(--accent); text-decoration: none;">前往登入頁面 →</a>
        </div>
        <div id="pet-list">等待資料讀取...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. 初始化地圖 (放在最外層，確保只執行一次)
        const map = L.map('map', { zoomControl: false }).setView([24.958, 121.24], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        const markers = {};

        // 2. 靜態權限檢查 (不使用自動跳轉，避免死對抗)
        onAuthStateChanged(auth, (user) => {
            const alertBox = document.getElementById('auth-alert');
            if (!user) {
                alertBox.style.display = 'block';
                console.warn("Auth Status: Not Logged In");
            } else {
                alertBox.style.display = 'none';
                console.log("Auth Status: Logged In as", user.email);
            }
        });

        // 3. 穩定監聽
        onSnapshot(collection(db, "cats"), (snapshot) => {
            const listContainer = document.getElementById('pet-list');
            listContainer.innerHTML = ""; 

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.last_location) {
                    const id = doc.id;
                    const pos = [data.last_location.latitude, data.last_location.longitude];
                    
                    if (!markers[id]) {
                        markers[id] = L.marker(pos).addTo(map).bindTooltip(data.name || id);
                    } else {
                        markers[id].setLatLng(pos);
                    }

                    const item = document.createElement('div');
                    item.className = 'pet-item';
                    item.innerHTML = `<strong>🐈 ${data.name || id}</strong><br><small>狀態：${data.status || '未知'}</small>`;
                    item.onclick = () => map.flyTo(pos, 17);
                    listContainer.appendChild(item);
                }
            });
        }, (err) => {
            console.error("Firestore Error:", err.message);
            if(err.message.includes("permission-denied")) {
                document.getElementById('pet-list').innerHTML = "<div style='color:red; font-size:13px;'>❌ 權限不足。<br>請確保已登入且 Firebase Rules 已開啟。</div>";
            }
        });
    </script>
</body>
</html>
