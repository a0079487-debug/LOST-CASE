<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 核心控制台</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --apple-blue: #007aff; --bg-grey: #f5f5f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-grey); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 側邊欄：多寵物清單 */
        #sidebar { width: 350px; background: white; border-right: 1px solid #d2d2d7; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 30px 20px; border-bottom: 1px solid #eee; }
        .sidebar-header h1 { font-size: 22px; margin: 0; color: #1d1d1f; }
        
        #pet-list { flex: 1; overflow-y: auto; padding: 10px; }
        .pet-item { 
            padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #e5e5e7;
            cursor: pointer; transition: 0.2s; background: #fafafa;
        }
        .pet-item:hover { background: #f0f7ff; border-color: var(--apple-blue); }
        .pet-item.active { background: #e1f0ff; border-color: var(--apple-blue); }
        .pet-name { font-weight: bold; font-size: 16px; display: block; }
        .pet-status { font-size: 13px; color: #86868b; }

        /* 右側：地圖區域 */
        #main-content { flex: 1; position: relative; display: flex; flex-direction: column; }
        #map { flex: 1; width: 100%; }
        
        /* 浮動詳細資訊卡 */
        #detail-card { 
            position: absolute; bottom: 20px; right: 20px; width: 280px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            z-index: 1000; display: none; border: 1px solid rgba(255,255,255,0.3);
        }
        .logout-btn { 
            margin-top: auto; padding: 15px; border-top: 1px solid #eee; 
            text-align: center; color: #ff3b30; cursor: pointer; font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>寵物監控中心</h1>
            <p style="font-size: 12px; color: #86868b;">即時追蹤所有成員</p>
        </div>
        <div id="pet-list">
            <p style="text-align: center; color: #999; margin-top: 20px;">載入中...</p>
        </div>
        <div class="logout-btn" id="logoutBtn">登出管理系統</div>
    </div>

    <div id="main-content">
        <div id="map"></div>
        <div id="detail-card">
            <h3 id="focus-name" style="margin-top: 0;">--</h3>
            <p class="pet-status">最後回報：<span id="focus-time">--</span></p>
            <p class="pet-status">狀態：<span id="focus-status">--</span></p>
            <p class="pet-status">聯絡：<a id="focus-phone" href="#">--</a></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. 權限檢查：沒登入就踢回 login.html
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        // 2. 初始化地圖
        const map = L.map('map', { zoomControl: false }).setView([24.958, 121.24], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        const markers = {}; // 儲存所有標記

        // 3. 監聽整個 cats 集合
        onSnapshot(collection(db, "cats"), (snapshot) => {
            const listContainer = document.getElementById('pet-list');
            listContainer.innerHTML = ""; // 清空舊清單

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                
                if (data.last_location) {
                    const pos = [data.last_location.latitude, data.last_location.longitude];
                    const name = data.name || `小貓 ${id}`;

                    // 更新地圖上的標記
                    if (markers[id]) {
                        markers[id].setLatLng(pos);
                    } else {
                        markers[id] = L.marker(pos).addTo(map);
                        markers[id].bindTooltip(name, { permanent: true, direction: 'top' });
                    }

                    // 建立左側選單項目
                    const item = document.createElement('div');
                    item.className = 'pet-item';
                    item.innerHTML = `
                        <span class="pet-name">🐈 ${name}</span>
                        <span class="pet-status">${data.status || '位置更新中...'}</span>
                    `;

                    // 點擊事件：飛往該貓咪並顯示詳細資訊
                    item.onclick = () => {
                        // 移除所有選單的 active 樣式
                        document.querySelectorAll('.pet-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');

                        map.flyTo(pos, 17);
                        showDetail(data, name);
                    };

                    listContainer.appendChild(item);
                }
            });
        });

        function showDetail(data, name) {
            const card = document.getElementById('detail-card');
            card.style.display = 'block';
            document.getElementById('focus-name').innerText = name;
            document.getElementById('focus-status').innerText = data.status || '未知';
            document.getElementById('focus-time').innerText = data.last_seen ? data.last_seen.toDate().toLocaleString() : '剛才';
            document.getElementById('focus-phone').innerText = data.reporter_phone || '未提供';
            document.getElementById('focus-phone').href = `tel:${data.reporter_phone}`;
        }

        // 4. 登出功能
        document.getElementById('logoutBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
