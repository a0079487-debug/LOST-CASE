<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 監控中心 - 終極穩定版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #007aff; --bg: #f5f5f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background: white; border-right: 1px solid #d2d2d7; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 30px 20px; border-bottom: 1px solid #eee; }
        #pet-list { flex: 1; overflow-y: auto; padding: 15px; }
        
        /* 列表項目穩定樣式 */
        .pet-item { 
            padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #e5e5e7;
            cursor: pointer; background: #fff; transition: transform 0.1s;
        }
        .pet-item.active { border-color: var(--accent); background: #f0f7ff; }
        .pet-name { font-weight: bold; font-size: 16px; color: #1d1d1f; display: block; }
        .pet-status { font-size: 13px; color: #86868b; }

        #main-content { flex: 1; position: relative; background: #ddd; }
        #map { height: 100%; width: 100%; }
        
        #detail-card { 
            position: absolute; bottom: 25px; right: 25px; width: 280px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            z-index: 1000; display: none; border: 1px solid #fff;
        }
        .logout-btn { padding: 20px; border-top: 1px solid #eee; text-align: center; color: #ff3b30; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>寵物監控中心</h1>
            <p style="font-size: 12px; color: #86868b;">硬體加速穩定模式</p>
        </div>
        <div id="pet-list"></div>
        <div class="logout-btn" id="logoutBtn">登出管理員帳號</div>
    </div>

    <div id="main-content">
        <div id="map"></div>
        <div id="detail-card">
            <h3 id="focus-name" style="margin: 0 0 10px 0; color: var(--accent);">--</h3>
            <div class="pet-status">最後回報：<span id="focus-time" style="color:#333">--</span></div>
            <div class="pet-status">目前狀態：<span id="focus-status" style="color:#333">--</span></div>
            <div class="pet-status">回報電話：<a id="focus-phone" href="#" style="color:var(--accent); text-decoration:none;">--</a></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ 貼上你的 Config
        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 地圖初始化 (確保只執行一次) ---
        const map = L.map('map', { zoomControl: false, fadeAnimation: false }).setView([24.958, 121.24], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        
        const markers = {}; // 暫存 Marker 對象

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        // --- 核心穩定監聽邏輯 ---
        onSnapshot(collection(db, "cats"), (snapshot) => {
            const listContainer = document.getElementById('pet-list');

            snapshot.docChanges().forEach((change) => {
                const data = change.doc.data();
                const id = change.doc.id;
                const name = data.name || `小貓 ${id}`;
                
                if (!data.last_location) return;
                const pos = [data.last_location.latitude, data.last_location.longitude];

                if (change.type === "added" || change.type === "modified") {
                    // 1. 更新地圖標記 (不刪除，只移動)
                    if (markers[id]) {
                        markers[id].setLatLng(pos);
                    } else {
                        markers[id] = L.marker(pos).addTo(map);
                        markers[id].bindTooltip(name);
                    }

                    // 2. 更新側邊欄 (精準更新特定 ID 的 DOM，不使用 innerHTML = "")
                    let item = document.getElementById(`pet-item-${id}`);
                    if (!item) {
                        item = document.createElement('div');
                        item.id = `pet-item-${id}`;
                        item.className = 'pet-item';
                        listContainer.appendChild(item);
                    }
                    
                    item.innerHTML = `
                        <span class="pet-name">🐈 ${name}</span>
                        <span class="pet-status">狀態：${data.status || '連線中'}</span>
                    `;

                    item.onclick = () => {
                        document.querySelectorAll('.pet-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        map.flyTo(pos, 17);
                        showDetailCard(data, name);
                    };
                }

                if (change.type === "removed") {
                    if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
                    const item = document.getElementById(`pet-item-${id}`);
                    if (item) item.remove();
                }
            });
        });

        function showDetailCard(data, name) {
            const card = document.getElementById('detail-card');
            card.style.display = 'block';
            document.getElementById('focus-name').innerText = name;
            document.getElementById('focus-status').innerText = data.status || '未知';
            document.getElementById('focus-time').innerText = data.last_seen ? data.last_seen.toDate().toLocaleString('zh-TW') : '剛剛';
            document.getElementById('focus-phone').innerText = data.reporter_phone || '未提供';
            document.getElementById('focus-phone').href = `tel:${data.reporter_phone}`;
        }

        document.getElementById('logoutBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
