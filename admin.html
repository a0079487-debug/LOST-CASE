<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 監控中心 - 止血穩定版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --accent: #007aff; --bg: #f5f5f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 350px; background: white; border-right: 1px solid #d2d2d7; display: flex; flex-direction: column; z-index: 1000; }
        #pet-list { flex: 1; overflow-y: auto; padding: 15px; }
        .pet-item { padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #e5e5e7; cursor: pointer; background: #fff; }
        #map { flex: 1; height: 100%; width: 100%; }
        #auth-status { padding: 10px; background: #ff3b30; color: white; font-size: 12px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="auth-status">⚠️ 尚未登入，功能可能受限</div>
        <div style="padding: 20px;"><h1>監控中心</h1></div>
        <div id="pet-list">等待資料連線...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 初始化地圖（移出監聽器，確保只跑一次）
        const map = L.map('map', { zoomControl: false }).setView([24.958, 121.24], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
        const markers = {};

        // 核心：檢查登入但不自動跳轉 (防止重整迴圈)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById('auth-status').style.display = 'block';
                console.warn("目前為訪客模式");
            } else {
                document.getElementById('auth-status').style.display = 'none';
                console.log("登入成功:", user.email);
            }
        });

        // 監聽資料
        onSnapshot(collection(db, "cats"), (snapshot) => {
            const listContainer = document.getElementById('pet-list');
            listContainer.innerHTML = ""; 

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.last_location) {
                    const id = doc.id;
                    const pos = [data.last_location.latitude, data.last_location.longitude];
                    
                    if (!markers[id]) {
                        markers[id] = L.marker(pos).addTo(map).bindTooltip(data.name || id);
                    } else {
                        markers[id].setLatLng(pos);
                    }

                    const item = document.createElement('div');
                    item.className = 'pet-item';
                    item.innerHTML = `<strong>🐈 ${data.name || id}</strong><br><small>${data.status}</small>`;
                    item.onclick = () => map.flyTo(pos, 17);
                    listContainer.appendChild(item);
                }
            });
        }, (err) => {
            console.error("Firebase Error:", err.message);
            if(err.message.includes("permission")) {
                document.getElementById('pet-list').innerHTML = "❌ 權限不足，請先登入。";
            }
        });
    </script>
</body>
</html>
