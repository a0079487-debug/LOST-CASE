<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginnabong 監控中心</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg-color: #f5f5f7; --card-bg: #ffffff; --accent-color: #007aff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 2; padding: 20px; box-sizing: border-box; }
        #map { height: 100%; width: 100%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); }
        #sidebar { flex: 1; min-width: 320px; background: var(--card-bg); border-left: 1px solid #d2d2d7; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .header h1 { font-size: 24px; margin: 0; }
        .info-card { background: #fbfbfd; border-radius: 15px; padding: 20px; border: 1px solid #e5e5e7; }
        .label { font-size: 12px; color: #86868b; font-weight: 600; margin-bottom: 8px; }
        .value { font-size: 17px; font-weight: 500; color: #1d1d1f; margin-bottom: 10px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; background: var(--accent-color); color: white; font-size: 13px; }
        a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>
    <div id="map-container"><div id="map"></div></div>
    <div id="sidebar">
        <div class="header"><h1>監控總覽</h1><p>即時追蹤 Ginnabong 位置</p></div>
        <div class="info-card">
            <div class="label">目前狀態</div>
            <div class="value"><span id="status" class="status-badge">等待回報...</span></div>
            <div class="label">最後見到時間</div>
            <div class="value" id="time">-- : --</div>
            <div class="label">回報者電話</div>
            <div class="value"><a id="phone" href="#">--</a></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ 務必替換為你從 Firebase Console 複製出來的真實 Config！
        const firebaseConfig = {
          apiKey: "AIzaSyDOawawFvDc1TJEwRKxPoQaXD0ZBqbOxjg",
          authDomain: "lost-case-26b82.firebaseapp.com",
          databaseURL: "https://lost-case-26b82-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "lost-case-26b82",
          storageBucket: "lost-case-26b82.firebasestorage.app",
          messagingSenderId: "377183470527",
          appId: "1:377183470527:web:aa0b14e7994de7912a570a",
          measurementId: "G-NMQB7RZWEW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 初始化地圖（預設座標設在中心點）
        const map = L.map('map', { zoomControl: false }).setView([24.958, 121.24], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        const marker = L.marker([24.958, 121.24]).addTo(map);

        // 即時監聽 Firebase
        onSnapshot(doc(db, "cats", "1"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // 檢查資料結構是否存在
                if (data.last_location) {
                    const { latitude, longitude } = data.last_location;
                    const pos = [latitude, longitude];
                    
                    // 更新標記與地圖
                    marker.setLatLng(pos);
                    map.flyTo(pos, 17);
                    marker.bindPopup(`<b>最後位置</b><br>狀態：${data.status || '未知'}`).openPopup();

                    // 更新 UI 介面
                    document.getElementById('status').innerText = data.status || '未知';
                    document.getElementById('time').innerText = data.last_seen ? data.last_seen.toDate().toLocaleString('zh-TW') : "剛剛";
                    document.getElementById('phone').innerText = data.reporter_phone || "未提供";
                    document.getElementById('phone').href = `tel:${data.reporter_phone}`;
                    
                    console.log("資料同步成功！", data);
                }
            } else {
                console.error("找不到資料庫中的文件：cats/1");
            }
        }, (error) => {
            console.error("Firebase 監聽錯誤：", error.message);
            if (error.message.includes("permissions")) {
                alert("資料庫讀取權限不足，請檢查 Firebase Rules！");
            }
        });
    </script>
</body>
</html>
